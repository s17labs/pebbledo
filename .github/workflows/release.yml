name: Release

# Cut a release by pushing a tag:
#   git tag v1.1.0 && git push origin v1.1.0
#
# Produces a GitHub Release containing:
#   - PebbleDo-<version>-debug.apk
#   - PebbleDo-<version>-release.apk   (signed with private secrets when set,
#                                       else with the committed public keystore)
#
# Optional signing secrets (repo Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_B64       base64-encoded .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > keystore.properties
            echo "Signing configured from secrets."
          else
            echo "No signing secrets set — signing with the committed public keystore."
          fi

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Stage release artifacts
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          REL_APK=app/build/outputs/apk/release/app-release.apk
          # Unsigned builds (no signing secrets) get "-unsigned" suffix
          if [ ! -f "$REL_APK" ]; then
            REL_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk  "dist/PebbleDo-${VERSION}-debug.apk"
          cp "$REL_APK"                                 "dist/PebbleDo-${VERSION}-release.apk"
          ls -la dist

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Pull the "## [VERSION] …" section out of CHANGELOG.md
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          # Fallback if no matching section exists yet
          if [ ! -s release-notes.md ]; then
            echo "PebbleDo v${VERSION}" > release-notes.md
            echo "" >> release-notes.md
            echo "See CHANGELOG.md for details." >> release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PebbleDo v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            dist/PebbleDo-*.apk
